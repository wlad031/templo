name: Publish Gitea package

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    if: gitea.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: sbt/setup-sbt@v1
      - name: Publish tagged artifact
        env:
          GITEA_USERNAME: ${{ secrets.PACKAGE_USERNAME }}
          GITEA_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          VERSION="${{ gitea.ref_name }}"
          VERSION="${VERSION#v}"
          VERSION="$VERSION" sbt clean test publish
